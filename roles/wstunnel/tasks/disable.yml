---
- name: Inspect previously installed wstunnel service
  ansible.builtin.stat:
    path: /etc/systemd/system/wstunnel.service
  register: wstunnel_existing_unit

- name: Stop and disable wstunnel after native WireGuard is restored
  ansible.builtin.systemd_service:
    name: wstunnel
    state: stopped
    enabled: false
  when: wstunnel_existing_unit.stat.exists

- name: Remove unused wstunnel authentication material
  ansible.builtin.file:
    path: /etc/wstunnel/authentication.env
    state: absent
  when: wstunnel_existing_unit.stat.exists
